<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atomic settlement sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    .lede { font-size: 1rem; line-height: 1.6; color: var(--color-muted); margin-bottom: 1.5rem; max-width: 70ch; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · NetSettle</p>
    <h1>One commit, or nothing.</h1>
    <p class="lede">The operator builds obligations and proposals, subsidiaries approve, and Execute archives everything and issues every receipt in a single transaction. A failed leg aborts the whole commit.</p>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seq-title seq-desc">
        <title id="seq-title">Atomic settlement sequence</title>
        <desc id="seq-desc">The treasury UI, operator service, Canton ledger and bank exchange ten messages that end in one atomic Execute and a payment file upload.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- lifelines -->
        <line x1="160" y1="112" x2="160" y2="480" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="380" y1="112" x2="380" y2="480" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="620" y1="112" x2="620" y2="480" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="840" y1="112" x2="840" y2="480" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- activation bars -->
        <rect x="376" y="150" width="8" height="256" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="616" y="246" width="8" height="128" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- messages -->
        <line x1="160" y1="150" x2="380" y2="150" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="232" y="130" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="260" y="139" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INGEST CSV</text>

        <path d="M 380,182 H 412 V 198 H 380" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="418" y="178" width="62" height="12" rx="2" fill="#f5f5f5"/>
        <text x="449" y="187" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PARSE · MAP</text>

        <line x1="160" y1="214" x2="380" y2="214" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="229" y="194" width="82" height="12" rx="2" fill="#f5f5f5"/>
        <text x="270" y="203" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DROP + RESOLVE</text>

        <line x1="380" y1="246" x2="620" y2="246" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="464" y="226" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="500" y="235" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OBLIGATION ×8</text>

        <line x1="380" y1="278" x2="620" y2="278" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="469" y="258" width="62" height="12" rx="2" fill="#f5f5f5"/>
        <text x="500" y="267" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROPOSAL ×2</text>

        <line x1="160" y1="310" x2="380" y2="310" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="234" y="290" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="270" y="299" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APPROVE EACH</text>

        <line x1="380" y1="342" x2="620" y2="342" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="475" y="322" width="50" height="12" rx="2" fill="#f5f5f5"/>
        <text x="500" y="331" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXECUTE</text>

        <line x1="620" y1="374" x2="380" y2="374" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="469" y="354" width="62" height="12" rx="2" fill="#f5f5f5"/>
        <text x="500" y="363" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">4 RECEIPTS</text>

        <line x1="380" y1="406" x2="160" y2="406" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="229" y="386" width="82" height="12" rx="2" fill="#f5f5f5"/>
        <text x="270" y="395" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CSV + PAIN.001</text>

        <line x1="160" y1="438" x2="840" y2="438" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="464" y="418" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="500" y="427" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UPLOAD FILE</text>

        <!-- actors -->
        <g>
          <rect x="85" y="64" width="150" height="48" rx="6" fill="#f5f5f5"/>
          <rect x="85" y="64" width="150" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="160" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Treasury UI</text>
          <text x="160" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Next.js pages</text>
        </g>
        <g>
          <rect x="305" y="64" width="150" height="48" rx="6" fill="#f5f5f5"/>
          <rect x="305" y="64" width="150" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
          <text x="380" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Operator</text>
          <text x="380" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">API routes</text>
        </g>
        <g>
          <rect x="545" y="64" width="150" height="48" rx="6" fill="#f5f5f5"/>
          <rect x="545" y="64" width="150" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
          <text x="620" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Canton ledger</text>
          <text x="620" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">participant node</text>
        </g>
        <g>
          <rect x="765" y="64" width="150" height="48" rx="6" fill="#f5f5f5"/>
          <rect x="765" y="64" width="150" height="48" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
          <text x="840" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bank</text>
          <text x="840" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">existing rail</text>
        </g>

        <!-- legend -->
        <line x1="30" y1="524" x2="930" y2="524" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="30" y="540" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
        <line x1="30" y1="554" x2="60" y2="554" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="68" y="558" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">atomic commit</text>
        <line x1="230" y1="554" x2="260" y2="554" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="268" y="558" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">return</text>
        <rect x="380" y="548" width="8" height="12" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="396" y="558" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">holds control</text>
      </svg>
    </div>
  </div>
</body>
</html>
